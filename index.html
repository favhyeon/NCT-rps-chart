<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>엔페스 통합 취향표</title>

<meta property="og:title" content="엔페스 통합 취향표">
<meta property="og:description" content="NCT 127 · WayV · DREAM · WISH 25인 통합 취향표">
<meta property="og:image" content="assets/m2.png">
<link rel="icon" href="assets/m1.png">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <header class="page-header">
        <h1>엔페스 통합 취향표<span id="dateTextRps" class="date-ver"></span></h1>
        <p class="page-sub">NCT 127 · WayV · DREAM · WISH — 25인</p>
    </header>

    <div class="tab-wrap">
        <button id="tabRps" class="tab-btn active">취향표</button>
        <button id="tabLr" class="tab-btn">공수 취향표</button>
    </div>

    <div class="toggle-row">
        <label class="switch-toggle" id="dateToggleWrap">
            <input type="checkbox" id="dateToggle">
            <span>날짜 표시</span>
        </label>
        <label class="switch-toggle">
            <input type="checkbox" id="selfPairToggle">
            <span>자공자수 표시</span>
        </label>
    </div>

    <div class="group-switch">
        <span class="group-switch-label">유닛 전환</span>
        <div class="group-switch-options">
            <label class="group-chip">
                <input type="checkbox" id="groupEnpes">
                <span>엔페스</span>
            </label>
            <label class="group-chip">
                <input type="checkbox" id="groupChil">
                <span>칠페스</span>
            </label>
            <label class="group-chip">
                <input type="checkbox" id="groupDeu">
                <span>드페스</span>
            </label>
            <label class="group-chip">
                <input type="checkbox" id="groupWe">
                <span>웨페스</span>
            </label>
            <label class="group-chip">
                <input type="checkbox" id="groupIt">
                <span>잇페스</span>
            </label>
        </div>
    </div>

    <div class="guide-box" id="guideListRps"></div>

    <div class="scale-wrap" id="scaleWrap">
        <!-- ===================== RPS 취향표 ===================== -->
        <div class="capture-area" id="captureArea">
            <div class="capture-title">
                <h2>엔페스 취향표</h2>
            </div>

            <div class="table-wrap">
                <table id="chartTable"></table>
            </div>

            <div class="legend" id="legendRps"></div>
        </div>

        <!-- ===================== 공수(L-R) 취향표 ===================== -->
        <div class="capture-area hidden" id="captureAreaLr">
            <div class="capture-title">
                <h2>엔페스 공수 취향표<span id="dateTextLr" class="date-ver"></span></h2>
            </div>

            <div class="guide-box lr-guide" id="guideListLr"></div>

            <div class="lr-grid" id="lrGrid"></div>
        </div>
    </div>

    <div class="button-wrap">
        <button id="undoBtn" class="icon-btn" disabled title="이전">↺</button>
        <button id="redoBtn" class="icon-btn" disabled title="이후">↻</button>
        <button id="resetBtn" class="ghost-btn">초기화</button>
        <button id="saveBtn" class="primary-btn">이미지 저장</button>
    </div>

</div>

<!-- 색상 선택 모달 -->
<div class="modal hidden" id="modal">
    <div class="modal-content">
        <div class="modal-head">
            <h3 id="modalTitle"></h3>
            <button id="closeModal" class="modal-close">&times;</button>
        </div>
        <div class="option-grid" id="optionGrid"></div>
    </div>
</div>

<!-- 저장 완료 모달 -->
<div class="modal hidden" id="saveModal">
    <div class="modal-content save-modal-content">
        <div class="modal-head">
            <h3>이미지가 저장됐어요</h3>
            <button id="closeSaveModal" class="modal-close">&times;</button>
        </div>
        <img id="previewImage" alt="미리보기">
    </div>
</div>

<input type="file" id="photoInput" accept="image/*" class="visually-hidden">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
